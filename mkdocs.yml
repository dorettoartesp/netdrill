site_name: "NetDrill Documentation"
site_description: "Automated documentation and developer portal for netdrill"
site_author: "Engineering Team"
repo_name: "netdrill"

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - content.code.copy

plugins:
  - search

nav:
  - Overview: index.md
  - Architecture: ARCHITECTURE.md
  - Architecture Decisions (ADRs):
      - Overview: adr/README.md
      - Template: adr/template.md
      - "0001: Record Architecture Decisions": adr/0001-record-architecture-decisions.md
  - Backlog & Roadmap:
      - Governance: backlog/README.md
      - Roadmap: backlog/roadmap.md
      - Items: backlog/items.md
  - API Contracts:
      - Overview: api/README.md
  - Operations & Runbooks:
      - Overview: runbooks/README.md
  - Development: DEVELOPMENT.md
  - Security Practices: SECURITY_PRACTICES.md
