<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetDrill — Redesenho mobile</title>
<style>
  :root { --bg: #f6f7f9; --fg: #0f172a; --muted: #475569; --card: #ffffff; --line: #d8dde6; --accent: #15803d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0e14; --fg: #e2e8f0; --muted: #94a3b8; --card: #161922; --line: #262b3d; --accent: #22c55e; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; line-height: 1.5; }
  main { max-width: 1280px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  p.lead { margin: 0 0 32px; color: var(--muted); }
  .phones { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
  @media (max-width: 1023px) { .phones { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 767px) { .phones { grid-template-columns: minmax(0, 1fr); } }
  figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
  figure img { display: block; width: 100%; height: auto; border-radius: 10px; }
  figcaption { padding: 10px 4px 2px; font-size: 14px; color: var(--muted); }
  figcaption strong { color: var(--fg); display: block; }
  .desktop { margin-top: 32px; }
  a { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Redesenho mobile</h1>
  <p class="lead">Capturas da implementação em 390 × 844 px (mobile) e 1280 × 800 px (desktop). Fontes do protótipo aprovado em <a href="canvas/canvas.json">canvas/</a>.</p>

  <section class="phones" aria-label="Telas mobile">
    <figure>
      <img src="screens/1-topicos.png" alt="Seleção de tópicos: duração em controle segmentado, lista de tópicos e botão Iniciar treino fixo no rodapé" width="780" height="1688">
      <figcaption><strong>1 · Seleção de tópicos</strong>Rota <code>/</code></figcaption>
    </figure>
    <figure>
      <img src="screens/2-treino.png" alt="Treino com comando longo quebrando linha no campo de digitação e barra de símbolos acima das ações Teste cego e Validar" width="780" height="1688">
      <figcaption><strong>2 · Treino</strong>Rota <code>/?topics=…</code>, aba Treino</figcaption>
    </figure>
    <figure>
      <img src="screens/3-saida-anotada.png" alt="Saída anotada com quebra de linhas ativada e inspetor de métrica logo abaixo" width="780" height="1688">
      <figcaption><strong>3 · Saída anotada</strong>Quebra de linhas opcional, área cresce com o conteúdo</figcaption>
    </figure>
  </section>

  <figure class="desktop">
    <img src="screens/4-desktop.png" alt="Layout desktop preservado com atalhos de teclado" width="1280" height="800">
    <figcaption><strong>Desktop (≥ 1024 px)</strong>Layout e atalhos de teclado preservados</figcaption>
  </figure>
</main>
</body>
</html>
