<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Saída anotada</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22c55e}a:hover{color:#4ade80}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #38bdf8;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0c0e14; color: #e2e8f0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="flex-shrink: 0; border-bottom: 1px solid #1d2230">
    <div style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 2px">
      <a href="Main.dc.html" aria-label="Mudar tópicos" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; color: #94a3b8">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 1px">
        <span style="font-size: 12px; color: #94a3b8">Administração Linux</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; color: #f1f5f9">7 de 30</span>
      </div>
      <div style="display: flex; align-items: center">
        <span style="height: 44px; padding: 0 10px; display: flex; align-items: center; gap: 6px; color: #fbbf24; font-family: 'JetBrains Mono', monospace; font-size: 15px; font-weight: 600">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4v16l13-8z"/></svg>
          12:48
        </span>
        <button type="button" aria-label="Mais opções" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #94a3b8; border-radius: 10px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>
        </button>
      </div>
    </div>
    <div style="height: 3px; background: #1d2230"><div style="width: 23%; height: 3px; background: #f59e0b"></div></div>
  </header>

  <nav aria-label="Modos de estudo" style="flex-shrink: 0; padding: 8px 12px 0">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #161922; border: 1px solid #262b3d; border-radius: 12px">
      <a href="Treino.dc.html" style="min-height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 9px; color: #94a3b8; font-size: 13px; font-weight: 500; text-decoration: none">Treino</a>
      <a href="#" style="min-height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 9px; color: #94a3b8; font-size: 13px; font-weight: 500; text-decoration: none">Casos de uso</a>
      <button type="button" aria-current="page" style="min-height: 40px; border: 0; border-radius: 9px; background: #0c0e14; color: #f8fafc; font-size: 13px; font-weight: 600; box-shadow: 0 0 0 1px #262b3d">Saída anotada</button>
    </div>
  </nav>

  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 8px 12px 16px; display: flex; flex-direction: column; gap: 8px">
    <div style="flex-shrink: 0; background: #05070a; border: 1px solid #262b3d; border-radius: 10px; overflow: hidden">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 0 0 12px; border-bottom: 1px solid #1d2230">
        <span style="display: flex; align-items: baseline; gap: 10px; min-width: 0">
          <code style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; color: #7dd3fc">$ ss -tulpn</code>
          <span style="font-size: 11px; color: #8b95a7">Pausado</span>
        </span>
        <button type="button" aria-pressed="{{wrapOn}}" onClick="{{toggleWrap}}" style="{{wrapBtnStyle}}">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h15a3 3 0 0 1 0 6h-4M3 18h7"/><path d="m16 16-2 2 2 2"/></svg>
          Quebrar linhas
        </button>
      </div>
      <div style="{{outStyle}}">
        <sc-for list="{{lines}}" as="line" hint-placeholder-count="4">
          <div style="{{lineStyle}}"><sc-for list="{{line.segs}}" as="s" hint-placeholder-count="3"><sc-if value="{{s.plain}}" hint-placeholder-val="{{true}}"><span>{{s.text}}</span></sc-if><sc-if value="{{s.hot}}" hint-placeholder-val="{{false}}"><button type="button" aria-pressed="{{s.on}}" onClick="{{s.pick}}" style="{{s.style}}">{{s.text}}</button></sc-if></sc-for></div>
        </sc-for>
      </div>
    </div>

  <section aria-label="Inspetor de métrica" aria-live="polite" style="flex-shrink: 0; background: #161922; border: 1px solid #262b3d; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <h2 style="margin: 0; font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 700; color: #f8fafc">{{m.label}}</h2>
      <span style="{{m.badgeStyle}}">{{m.badge}}</span>
    </div>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #cbd5e1">{{m.desc}}</p>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="padding: 10px 12px; border-radius: 10px; background: #0f1a14; border: 1px solid #14532d; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 11px; font-weight: 700; color: #4ade80; text-transform: uppercase; letter-spacing: 0.06em">Normal</span>
        <span style="font-size: 13px; line-height: 1.4; color: #d1d5db">{{m.normal}}</span>
      </div>
      <div style="padding: 10px 12px; border-radius: 10px; background: #1f0f12; border: 1px solid #7f1d1d; display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 11px; font-weight: 700; color: #fca5a5; text-transform: uppercase; letter-spacing: 0.06em">Anomalia</span>
        <span style="font-size: 13px; line-height: 1.4; color: #d1d5db">{{m.anomaly}}</span>
      </div>
    </div>
  </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { pick: 'recvq' };
  }
  renderVals() {
    const metrics = {
      state: { label: 'State: LISTEN', badge: 'Informativo', sev: 'info',
        desc: 'O socket aguarda conexões de entrada. UNCONN em UDP é o equivalente, pois UDP não estabelece conexão.',
        normal: 'Apenas serviços esperados escutando, nas portas previstas.',
        anomaly: 'Porta desconhecida em 0.0.0.0 indica serviço exposto indevidamente.' },
      recvq: { label: 'Recv-Q', badge: 'Atenção', sev: 'warn',
        desc: 'Em sockets LISTEN, indica conexões completas aguardando accept() pela aplicação.',
        normal: '0 ou valores baixos e transitórios.',
        anomaly: 'Próximo de Send-Q (backlog): a aplicação não aceita conexões a tempo.' },
      sendq: { label: 'Send-Q', badge: 'Informativo', sev: 'info',
        desc: 'Em sockets LISTEN, representa o tamanho máximo do backlog configurado.',
        normal: 'Coerente com net.core.somaxconn e com a configuração do serviço.',
        anomaly: 'Backlog reduzido em serviço de alto tráfego causa recusas de conexão.' },
      proc: { label: 'Process', badge: 'Informativo', sev: 'info',
        desc: 'Processo dono do socket, com PID e descritor de arquivo. Exibido apenas com -p e privilégios suficientes.',
        normal: 'Processo esperado para a porta, executado pelo usuário de serviço.',
        anomaly: 'Binário inesperado ou PID órfão escutando em porta de serviço.' }
    };
    const P = (t) => ({ text: t });
    const H = (t, k) => ({ text: t, key: k });
    const raw = [
      [P('Netid '), H('State', 'state'), P('  '), H('Recv-Q', 'recvq'), P(' '), H('Send-Q', 'sendq'), P(' Local Address:Port  '), H('Process', 'proc')],
      [P('tcp   LISTEN 0      128    0.0.0.0:22          users:(("sshd",pid=912,fd=3))')],
      [P('tcp   LISTEN '), H('0', 'recvq'), P('      '), H('511', 'sendq'), P('    0.0.0.0:80          '), H('users:(("nginx",pid=1420,fd=6))', 'proc')],
      [P('udp   '), H('UNCONN', 'state'), P(' 0      0      0.0.0.0:53          users:(("systemd-resolve",pid=604,fd=12))')]
    ];
    const pick = this.state.pick;
    const lines = raw.map((segs) => ({
      segs: segs.map((s) => {
        if (!s.key) return { text: s.text, plain: true, hot: false };
        const on = s.key === pick;
        return {
          text: s.text, plain: false, hot: true, on,
          style: 'font: inherit; line-height: inherit; vertical-align: baseline; padding: 0 3px; margin: 0; border-radius: 3px; border: 0; box-shadow: inset 0 0 0 1px ' + (on ? '#38bdf8' : '#0e4a5e') + '; background: ' + (on ? '#38bdf8' : '#0b1a22') + '; color: ' + (on ? '#04131a' : '#7dd3fc') + '; font-weight: 700; text-decoration: ' + (on ? 'none' : 'underline dotted'),
          pick: () => this.setState({ pick: s.key })
        };
      })
    }));
    const m0 = metrics[pick];
    const warn = m0.sev === 'warn';
    const m = { ...m0, badgeStyle: 'font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 4px 8px; border-radius: 6px; border: 1px solid ' + (warn ? '#78530f' : '#0e4a5e') + '; background: ' + (warn ? '#2a1f08' : '#0b1a22') + '; color: ' + (warn ? '#fbbf24' : '#7dd3fc') };
    const wrap = !!this.state.wrap;
    return {
      lines, m,
      wrapOn: wrap ? 'true' : 'false',
      toggleWrap: () => this.setState({ wrap: !wrap }),
      wrapBtnStyle: 'min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border: 0; background: transparent; font-size: 12px; font-weight: 600; color: ' + (wrap ? '#38bdf8' : '#94a3b8'),
      outStyle: 'overflow-x: auto; padding: 8px 12px; font-family: \'JetBrains Mono\', monospace; font-size: 12.5px; line-height: 1.5; color: #cbd5e1',
      lineStyle: wrap ? 'white-space: pre-wrap; overflow-wrap: anywhere' : 'white-space: pre; width: max-content'
    };
  }
}
</script>
</body>
</html>
