<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Treino com teclado aberto</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#22c55e}a:hover{color:#4ade80}
button,input{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid #22c55e;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0c0e14; color: #e2e8f0; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">

  <header style="flex-shrink: 0; border-bottom: 1px solid #1d2230">
    <div style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 0 16px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 600; color: #94a3b8">7 de 30</span>
      <sc-if value="{{blind}}" hint-placeholder-val="{{false}}">
        <span style="font-size: 12px; font-weight: 700; color: #fbbf24; text-transform: uppercase; letter-spacing: 0.08em">Teste cego</span>
      </sc-if>
      <button type="button" aria-label="Pausar cronômetro" style="height: 44px; padding: 0 12px; display: flex; align-items: center; gap: 6px; border: 0; background: transparent; color: #4ade80; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        12:31
      </button>
    </div>
    <div style="height: 3px; background: #1d2230"><div style="width: 23%; height: 3px; background: {{accent}}"></div></div>
  </header>

  <main style="flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
    <p style="margin: 0; font-size: 15px; line-height: 1.45; font-weight: 500; color: #e2e8f0">Há suspeita de lentidão no upstream. Colete tempos de conexão e primeiro byte.</p>

    <sc-if value="{{notBlind}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 10px 14px; background: #12141c; border: 1px solid #262b3d; border-radius: 10px">
        <span style="font-size: 12px; color: #94a3b8; align-self: flex-end">2 de 3</span>
        <code style="font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1.5; font-weight: 600; color: #4ade80; white-space: pre-wrap; overflow-wrap: anywhere">{{target}}</code>
      </div>
    </sc-if>
    <sc-if value="{{blind}}" hint-placeholder-val="{{false}}">
      <div style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #1a1408; border: 1px dashed #78530f; border-radius: 10px; font-size: 13px; color: #fcd34d">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        Gabarito oculto. Digite de memória.
      </div>
    </sc-if>

    <div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; background: #05070a; border: 2px solid {{accent}}; border-radius: 12px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 16px; line-height: 1.5; font-weight: 700; color: {{accent}}" aria-hidden="true">$</span>
      <label for="cmd2" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Seu comando</label>
      <textarea id="cmd2" rows="4" value="{{typed}}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send" style="flex: 1; min-width: 0; min-height: 96px; max-height: 168px; margin: 0; padding: 0; resize: none; background: transparent; border: 0; outline: none; color: #4ade80; font-family: 'JetBrains Mono', monospace; font-size: 16px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere"></textarea>
    </div>

    <sc-if value="{{isError}}" hint-placeholder-val="{{false}}">
      <div role="status" style="display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; background: #2a0f12; border: 1px solid #7f1d1d; border-radius: 10px; font-size: 13px; line-height: 1.45; color: #fca5a5">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 1px"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
        <span>Comando divergente do gabarito. Revise as opções informadas.</span>
      </div>
    </sc-if>
    <sc-if value="{{isOk}}" hint-placeholder-val="{{false}}">
      <div role="status" style="display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: #0b2215; border: 1px solid #166534; border-radius: 10px; font-size: 13px; color: #86efac">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
        <span>Correto. Repetição 3 de 3 concluída.</span>
      </div>
    </sc-if>
  </main>

  <div style="flex-shrink: 0; background: #11141c; border-top: 1px solid #262b3d; padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 8px">
    <div aria-label="Símbolos do terminal" style="display: flex; gap: 6px; overflow-x: auto">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="9">
        <button type="button" aria-label="{{k.aria}}" style="min-width: 44px; height: 44px; flex-shrink: 0; padding: 0 10px; border-radius: 8px; border: 1px solid #262b3d; background: #1a1e29; color: #f1f5f9; font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600">{{k.label}}</button>
      </sc-for>
      <button type="button" style="height: 44px; flex-shrink: 0; padding: 0 12px; border-radius: 8px; border: 1px solid #0e4a5e; background: #0b1a22; color: #7dd3fc; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600">man</button>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="grid-column: span 2; min-height: 48px; border-radius: 12px; border: 1px solid {{secondaryBorder}}; background: transparent; color: {{secondaryColor}}; font-size: 14px; font-weight: 600">{{secondaryLabel}}</button>
      <button type="button" style="grid-column: span 3; min-height: 48px; border: 0; border-radius: 12px; background: #22c55e; color: #052e16; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px">
        {{primaryLabel}}
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 10l-5 5 5 5M20 4v7a4 4 0 0 1-4 4H4"/></svg>
      </button>
    </div>
  </div>

  <div aria-hidden="true" style="height: 292px; flex-shrink: 0; background: repeating-linear-gradient(135deg, #1a1d26 0 10px, #161922 10px 20px); display: flex; align-items: center; justify-content: center; color: #8b95a7; font-size: 13px; letter-spacing: 0.04em">Teclado do sistema</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"modo":{"editor":"enum","options":["Repetição","Teste cego"],"default":"Repetição"},"feedback":{"editor":"enum","options":["Nenhum","Erro","Acerto"],"default":"Nenhum"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const blind = (this.props.modo ?? 'Repetição') === 'Teste cego';
    const fb = this.props.feedback ?? 'Nenhum';
    return {
      blind, notBlind: !blind,
      isError: fb === 'Erro', isOk: fb === 'Acerto',
      accent: blind ? '#f59e0b' : '#22c55e',
      target: 'curl -sS -o /dev/null -w "connect=%{time_connect} ttfb=%{time_starttransfer} total=%{time_total}\\n" http://127.0.0.1:8000/health',
      typed: fb === 'Erro'
        ? 'curl -s -o /dev/null -w "connect=%{time_connect} total=%{time_total}\\n" http://127.0.0.1:8000/health'
        : fb === 'Acerto'
        ? 'curl -sS -o /dev/null -w "connect=%{time_connect} ttfb=%{time_starttransfer} total=%{time_total}\\n" http://127.0.0.1:8000/health'
        : 'curl -sS -o /dev/null -w "connect=%{time_connect} ttfb=%{time_star',
      secondaryLabel: blind ? 'Ver gabarito' : 'Teste cego',
      secondaryBorder: blind ? '#334155' : '#78530f',
      secondaryColor: blind ? '#cbd5e1' : '#fbbf24',
      primaryLabel: blind ? 'Validar bloco' : 'Validar',
      keys: [
        { label: '-', aria: 'Hífen' }, { label: '_', aria: 'Sublinhado' }, { label: '/', aria: 'Barra' },
        { label: '|', aria: 'Pipe' }, { label: '"', aria: 'Aspas' }, { label: '$', aria: 'Cifrão' },
        { label: ':', aria: 'Dois-pontos' }, { label: '>', aria: 'Redirecionamento' }, { label: '⇥', aria: 'Tabulação' }
      ]
    };
  }
}
</script>
</body>
</html>
